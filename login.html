<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Elysium OS - Biometric Vault</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="auth.js"></script>

  <!-- Space Grotesk, Plus Jakarta Sans & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style id="elysium-modern-ui">
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-primary: #090d16;
      --bg-elevated: #111827;
      --bg-card: rgba(17, 24, 39, 0.90);
      --bg-subtle: rgba(30, 41, 59, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.10);
      --border-input: rgba(148, 163, 184, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --card-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.55);
    }

    html.light-theme {
      --bg-primary: #eef2f7;
      --bg-elevated: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.96);
      --bg-subtle: #e2e8f0;
      --border-subtle: rgba(15, 23, 42, 0.10);
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --card-shadow: 0 10px 26px -6px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans) !important;
      background-color: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(99, 102, 241, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 90% 5%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(14, 165, 233, 0.10) 0%, transparent 45%) !important;
      background-attachment: fixed !important;
      padding-top: 0.25rem !important;
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)) !important;
      margin: 0;
      letter-spacing: -0.012em;
      overflow-x: hidden;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    h1, h2, h3 {
      font-family: var(--font-display) !important;
      letter-spacing: -0.025em !important;
    }

    .font-mono {
      font-family: var(--font-mono) !important;
    }

    /* =====================================================================
       DARK MODE HIGH-CONTRAST SURFACES & TYPOGRAPHY
       ===================================================================== */
    html:not(.light-theme) .bg-white,
    html:not(.light-theme) .focus\:bg-white:focus {
      background: var(--bg-card) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      color: #f8fafc !important;
      border-color: var(--border-subtle) !important;
    }
    /* Catch ALL slate surface shades including opacity modifiers like bg-slate-50/60 */
    html:not(.light-theme) [class*="bg-slate-50"],
    html:not(.light-theme) [class*="bg-slate-100"],
    html:not(.light-theme) [class*="bg-slate-200"] {
      background: var(--bg-subtle) !important;
      color: #f1f5f9 !important;
      border-color: var(--border-subtle) !important;
    }
    html:not(.light-theme) .hover\:bg-slate-50:hover,
    html:not(.light-theme) .hover\:bg-slate-100:hover,
    html:not(.light-theme) .hover\:bg-slate-200:hover {
      background: rgba(51, 65, 85, 0.9) !important;
      color: #ffffff !important;
    }

    /* Crisp Neutral Text Hierarchy in Dark Mode */
    html:not(.light-theme) .text-slate-900,
    html:not(.light-theme) .text-slate-800 {
      color: #f8fafc !important;
    }
    html:not(.light-theme) .text-slate-700,
    html:not(.light-theme) .text-slate-600 {
      color: #e2e8f0 !important;
    }
    html:not(.light-theme) .text-slate-500,
    html:not(.light-theme) .text-slate-400 {
      color: #94a3b8 !important;
    }
    html:not(.light-theme) .border-slate-100,
    html:not(.light-theme) .border-slate-200,
    html:not(.light-theme) .border-slate-300 {
      border-color: rgba(255, 255, 255, 0.12) !important;
    }

    /* Luminous Accent Text in Dark Mode (Prevents dark-on-dark dullness) */
    html:not(.light-theme) .text-indigo-600,
    html:not(.light-theme) .text-indigo-700,
    html:not(.light-theme) .text-indigo-800,
    html:not(.light-theme) .text-indigo-900,
    html:not(.light-theme) .text-indigo-950 { color: #a5b4fc !important; }

    html:not(.light-theme) .text-blue-600,
    html:not(.light-theme) .text-blue-700,
    html:not(.light-theme) .text-blue-800 { color: #93c5fd !important; }

    html:not(.light-theme) .text-emerald-600,
    html:not(.light-theme) .text-emerald-700,
    html:not(.light-theme) .text-emerald-800,
    html:not(.light-theme) .text-emerald-900 { color: #6ee7b7 !important; }

    html:not(.light-theme) .text-teal-600,
    html:not(.light-theme) .text-teal-700,
    html:not(.light-theme) .text-teal-800,
    html:not(.light-theme) .text-teal-900 { color: #5eead4 !important; }

    html:not(.light-theme) .text-cyan-600,
    html:not(.light-theme) .text-cyan-700,
    html:not(.light-theme) .text-cyan-800 { color: #67e8f9 !important; }

    html:not(.light-theme) .text-rose-600,
    html:not(.light-theme) .text-rose-700,
    html:not(.light-theme) .text-rose-800,
    html:not(.light-theme) .text-rose-900,
    html:not(.light-theme) .text-red-500,
    html:not(.light-theme) .text-red-600,
    html:not(.light-theme) .text-red-700 { color: #fda4af !important; }

    html:not(.light-theme) .text-amber-600,
    html:not(.light-theme) .text-amber-700,
    html:not(.light-theme) .text-amber-800,
    html:not(.light-theme) .text-amber-900 { color: #fcd34d !important; }

    html:not(.light-theme) .text-purple-600,
    html:not(.light-theme) .text-purple-700,
    html:not(.light-theme) .text-purple-800 { color: #d8b4fe !important; }

    /* Tinted Badges & Containers in Dark Mode (Both -50, -100, and hover states) */
    html:not(.light-theme) [class*="bg-indigo-50"],
    html:not(.light-theme) .bg-indigo-100,
    html:not(.light-theme) [class*="bg-blue-50"],
    html:not(.light-theme) .bg-blue-100 {
      background: rgba(99, 102, 241, 0.20) !important;
      border-color: rgba(129, 140, 248, 0.35) !important;
      color: #c7d2fe !important;
    }
    html:not(.light-theme) .hover\:bg-indigo-50:hover,
    html:not(.light-theme) .hover\:bg-indigo-100:hover,
    html:not(.light-theme) .hover\:bg-blue-100:hover {
      background: rgba(99, 102, 241, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-emerald-50"],
    html:not(.light-theme) .bg-emerald-100,
    html:not(.light-theme) [class*="bg-teal-50"],
    html:not(.light-theme) .bg-teal-100,
    html:not(.light-theme) .bg-cyan-100 {
      background: rgba(16, 185, 129, 0.20) !important;
      border-color: rgba(52, 211, 153, 0.35) !important;
      color: #a7f3d0 !important;
    }
    html:not(.light-theme) .hover\:bg-emerald-100:hover,
    html:not(.light-theme) .hover\:bg-teal-100:hover {
      background: rgba(16, 185, 129, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-rose-50"],
    html:not(.light-theme) .bg-rose-100,
    html:not(.light-theme) [class*="bg-red-50"],
    html:not(.light-theme) .bg-red-100 {
      background: rgba(244, 63, 94, 0.20) !important;
      border-color: rgba(251, 113, 133, 0.35) !important;
      color: #fecdd3 !important;
    }
    html:not(.light-theme) .hover\:bg-rose-50:hover,
    html:not(.light-theme) .hover\:bg-rose-100:hover,
    html:not(.light-theme) .hover\:bg-red-50:hover,
    html:not(.light-theme) .hover\:bg-red-100:hover {
      background: rgba(244, 63, 94, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-amber-50"],
    html:not(.light-theme) .bg-amber-100 {
      background: rgba(245, 158, 11, 0.20) !important;
      border-color: rgba(251, 191, 36, 0.35) !important;
      color: #fde68a !important;
    }
    html:not(.light-theme) .hover\:bg-amber-50:hover,
    html:not(.light-theme) .hover\:bg-amber-100:hover {
      background: rgba(245, 158, 11, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-purple-50"],
    html:not(.light-theme) .bg-purple-100 {
      background: rgba(168, 85, 247, 0.20) !important;
      border-color: rgba(192, 132, 252, 0.35) !important;
      color: #e9d5ff !important;
    }
    html:not(.light-theme) .hover\:bg-purple-100:hover {
      background: rgba(168, 85, 247, 0.32) !important;
    }

    /* Border color overrides for colored pills in Dark Mode */
    html:not(.light-theme) .border-indigo-200 { border-color: rgba(129, 140, 248, 0.35) !important; }
    html:not(.light-theme) .border-emerald-200 { border-color: rgba(52, 211, 153, 0.35) !important; }
    html:not(.light-theme) .border-rose-200 { border-color: rgba(251, 113, 133, 0.35) !important; }
    html:not(.light-theme) .border-amber-200 { border-color: rgba(251, 191, 36, 0.35) !important; }
    html:not(.light-theme) .border-purple-200 { border-color: rgba(192, 132, 252, 0.35) !important; }

    /* Active Tab & Filter Pill Clarity in Dark Mode */
    html:not(.light-theme) #tabBtnCurrent.bg-white,
    html:not(.light-theme) #tabBtnReserved.bg-white,
    html:not(.light-theme) #tabBtnFuture.bg-white,
    html:not(.light-theme) #tabBtnRooms.bg-white,
    html:not(.light-theme) #tabBtnDues.bg-white,
    html:not(.light-theme) #btnTabActive.bg-white,
    html:not(.light-theme) #btnTabCompleted.bg-white {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.5) !important;
    }
    html:not(.light-theme) #tabBtnCurrent.bg-white i,
    html:not(.light-theme) #tabBtnReserved.bg-white i,
    html:not(.light-theme) #tabBtnFuture.bg-white i,
    html:not(.light-theme) #tabBtnRooms.bg-white i,
    html:not(.light-theme) #tabBtnDues.bg-white i {
      color: #ffffff !important;
    }

    /* Solid Colored Buttons Always Keep Crisp White Text in Both Themes */
    .bg-indigo-600, .bg-blue-600, .bg-emerald-600, .bg-teal-600, .bg-rose-600, .bg-purple-600,
    [class*="from-emerald-600"], [class*="from-rose-500"], [class*="from-indigo-600"], [class*="from-rose-600"] {
      color: #ffffff !important;
    }
    .bg-indigo-600 *, .bg-blue-600 *, .bg-emerald-600 *, .bg-teal-600 *, .bg-rose-600 *, .bg-purple-600 *,
    [class*="from-emerald-600"] *, [class*="from-rose-500"] *, [class*="from-indigo-600"] *, [class*="from-rose-600"] * {
      color: #ffffff !important;
    }

    /* =====================================================================
       LIGHT MODE HIGH-CONTRAST SURFACES & TYPOGRAPHY
       ===================================================================== */
    html.light-theme .bg-white {
      background: var(--bg-card) !important;
      color: #0f172a !important;
      border-color: rgba(15, 23, 42, 0.10) !important;
    }
    html.light-theme .text-slate-900,
    html.light-theme .text-slate-800 {
      color: #0f172a !important;
    }
    html.light-theme .text-slate-700,
    html.light-theme .text-slate-600 {
      color: #334155 !important;
    }
    html.light-theme .text-slate-500,
    html.light-theme .text-slate-400 {
      color: #475569 !important;
    }
    /* Ensure any pastel -200/-300 text inside light cards becomes rich, high-contrast -700/-800 */
    html.light-theme .bg-white .text-indigo-200,
    html.light-theme .bg-white .text-indigo-300,
    html.light-theme .text-indigo-300 { color: #4338ca !important; }

    html.light-theme .bg-white .text-violet-200,
    html.light-theme .bg-white .text-violet-300,
    html.light-theme .text-violet-300 { color: #6d28d9 !important; }

    html.light-theme .bg-white .text-emerald-200,
    html.light-theme .bg-white .text-emerald-300,
    html.light-theme .text-emerald-300 { color: #047857 !important; }

    html.light-theme .bg-white .text-teal-200,
    html.light-theme .bg-white .text-teal-300,
    html.light-theme .text-teal-300 { color: #0f766e !important; }

    html.light-theme .bg-white .text-cyan-200,
    html.light-theme .bg-white .text-cyan-300,
    html.light-theme .text-cyan-300 { color: #0e7490 !important; }

    html.light-theme .bg-white .text-sky-200,
    html.light-theme .bg-white .text-sky-300,
    html.light-theme .text-sky-300 { color: #0369a1 !important; }

    html.light-theme .bg-white .text-rose-200,
    html.light-theme .bg-white .text-rose-300,
    html.light-theme .text-rose-300 { color: #be123c !important; }

    html.light-theme .bg-white .text-amber-200,
    html.light-theme .bg-white .text-amber-300,
    html.light-theme .text-amber-300 { color: #b45309 !important; }

    html.light-theme .bg-white .text-purple-200,
    html.light-theme .bg-white .text-purple-300,
    html.light-theme .text-purple-300 { color: #6b21a8 !important; }

    html.light-theme .bg-white .text-blue-200,
    html.light-theme .bg-white .text-blue-300,
    html.light-theme .text-blue-300 { color: #1d4ed8 !important; }

    /* Adaptive Cloud/Rollover Cards in Light Mode */
    html.light-theme .elysium-adaptive-card {
      background: #ffffff !important;
      border-color: rgba(15, 23, 42, 0.10) !important;
      color: #0f172a !important;
      box-shadow: var(--card-shadow) !important;
    }
    html.light-theme .elysium-adaptive-card p.text-white {
      color: #0f172a !important;
    }

    /* =====================================================================
       EXECUTIVE DARK-GLASS TOP COMMAND BAR (Always High-Contrast White Text)
       ===================================================================== */
    header {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 27, 75, 0.92) 100%) !important;
      backdrop-filter: blur(22px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(22px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.35) !important;
      border-radius: 1.6rem !important;
      position: sticky !important;
      top: 0.5rem !important;
      z-index: 30 !important;
      padding: 1rem 1.15rem !important;
      color: #ffffff !important;
    }
    header h1 {
      color: #ffffff !important;
      font-size: 1.25rem !important;
      line-height: 1.3 !important;
    }
    header p, header span.text-slate-500, header label {
      color: #cbd5e1 !important;
    }
    header .text-indigo-300 { color: #a5b4fc !important; }
    header .text-purple-200 { color: #e9d5ff !important; }
    header .text-rose-300 { color: #fda4af !important; }
    header .text-emerald-300 { color: #6ee7b7 !important; }
    header a[href="index.html"] {
      background: rgba(255, 255, 255, 0.12) !important;
      color: #ffffff !important;
      padding: 0.4rem 0.8rem !important;
      border-radius: 9999px !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      font-weight: 700 !important;
    }
    header select, header input[type="date"], header input[type="number"] {
      background: rgba(15, 23, 42, 0.82) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 0.9rem !important;
      padding: 0.45rem 0.75rem !important;
      font-weight: 700 !important;
      color-scheme: dark;
    }
    header select option {
      background: #0f172a !important;
      color: #ffffff !important;
    }

    /* Bento Cards */
    div.bg-white.rounded-2xl, div.bg-white.rounded-3xl {
      border-radius: 1.5rem !important;
      box-shadow: var(--card-shadow) !important;
      border: 1px solid var(--border-subtle) !important;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease !important;
    }

    /* Inputs, Selects & Textareas */
    input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="time"], input[type="password"], select, textarea {
      background-color: rgba(15, 23, 42, 0.72) !important;
      color: #f8fafc !important;
      border: 1px solid var(--border-input) !important;
      border-radius: 0.95rem !important;
      min-height: 2.75rem;
      padding-left: 0.85rem;
      padding-right: 0.85rem;
      transition: all 0.18s ease !important;
      color-scheme: dark;
    }
    input.pl-7 { padding-left: 2.15rem !important; }
    input.pl-8 { padding-left: 2.45rem !important; }
    input.pl-9 { padding-left: 2.65rem !important; }
    input.pl-10 { padding-left: 2.85rem !important; }
    .relative > i + input,
    .relative > span + input {
      padding-left: 2.5rem !important;
    }
    html.light-theme input[type="text"],
    html.light-theme input[type="number"],
    html.light-theme input[type="tel"],
    html.light-theme input[type="date"],
    html.light-theme input[type="time"],
    html.light-theme input[type="password"],
    html.light-theme select,
    html.light-theme textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
      color-scheme: light;
    }
    header input[type="number"],
    header input[type="date"],
    header select {
      background-color: rgba(15, 23, 42, 0.85) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
    }
    input::placeholder, textarea::placeholder {
      color: #64748b !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3.5px rgba(99, 102, 241, 0.25) !important;
      outline: none !important;
    }

    /* 3D Tactile Room Matrix Pills */
    .room-btn {
      min-height: 3.5rem;
      border-radius: 1.1rem !important;
      background: rgba(30, 41, 59, 0.72) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
      position: relative;
      overflow: hidden;
    }
    html.light-theme .room-btn:not(.active) {
      background: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .room-btn:hover:not(.active) {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.55) !important;
    }
    .room-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
      box-shadow: 0 10px 24px -4px rgba(99, 102, 241, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.35) !important;
      transform: translateY(-2px) scale(1.03);
    }
    .room-btn.active span {
      color: #ffffff !important;
    }

    /* Floor Selector Pills */
    .floor-tab, .floor-btn {
      min-height: 2.4rem;
      border-radius: 0.85rem !important;
      font-weight: 800 !important;
      transition: all 0.18s ease !important;
    }
    .floor-tab.active, .floor-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 14px -2px rgba(99, 102, 241, 0.5) !important;
    }

    /* Interactive Resident Cards */
    .resident-card {
      border-radius: 1.25rem !important;
      padding: 1rem !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .resident-card.active {
      border: 2px solid #6366f1 !important;
      background: rgba(99, 102, 241, 0.16) !important;
      box-shadow: 0 12px 28px -6px rgba(99, 102, 241, 0.3) !important;
    }

    /* Tactile Buttons */
    button, a.rounded-xl, a.rounded-2xl {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
      user-select: none;
    }
    button:active:not(:disabled) {
      transform: scale(0.95) !important;
    }

    /* Mobile Bottom Sheet Modals */
    @media (max-width: 640px) {
      input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
        font-size: 15px !important;
      }
      .fixed.inset-0.z-40:not(.hidden),
      #deleteConfirmModal:not(.hidden) {
        align-items: flex-end !important;
        padding: 0 !important;
      }
      .fixed.inset-0.z-40:not(.hidden) > div,
      #deleteConfirmModal:not(.hidden) > div {
        max-width: 100% !important;
        width: 100% !important;
        border-bottom-left-radius: 0 !important;
        border-bottom-right-radius: 0 !important;
        border-top-left-radius: 2rem !important;
        border-top-right-radius: 2rem !important;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)) !important;
        animation: mobileSheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .fixed.inset-0.z-40:not(.hidden) > div::before {
        content: "";
        display: block;
        width: 3rem;
        height: 0.32rem;
        background: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
        margin: -0.35rem auto 0.9rem auto;
      }
    }
    @keyframes mobileSheetSlideUp {
      0% { opacity: 0; transform: translateY(100%); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Floating Glass Bottom App Dock */
    #elysiumBottomDock {
      position: fixed;
      bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 22px 48px -8px rgba(0, 0, 0, 0.65);
      border-radius: 1.5rem;
      padding: 0.38rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.15rem;
      width: min(96vw, 520px);
    }
    #elysiumBottomDock a,
    #elysiumBottomDock button.dock-action-btn {
      flex: 1 0 auto;
      color: #cbd5e1;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 0.45rem 0.5rem;
      border-radius: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      white-space: nowrap;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #elysiumBottomDock a i,
    #elysiumBottomDock button.dock-action-btn i {
      font-size: 1rem;
    }
    #elysiumBottomDock a.dock-active {
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
      box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.55);
      transform: translateY(-2px);
    }

    /* Slide-Up All-Modules Launcher Drawer (#elysiumAppDrawer) */
    #elysiumAppDrawer {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    #elysiumAppDrawer.open {
      display: flex;
    }
    #elysiumAppDrawer .drawer-sheet {
      width: min(100vw, 540px);
      max-height: 86vh;
      overflow-y: auto;
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      border-top-left-radius: 2rem;
      border-top-right-radius: 2rem;
      padding: 1.25rem 1.25rem calc(1.75rem + env(safe-area-inset-bottom, 0px)) 1.25rem;
      color: #f8fafc;
      animation: mobileSheetSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <style>
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.7; }
      70% { transform: scale(1.22); opacity: 0; }
      100% { transform: scale(1.22); opacity: 0; }
    }
    .bio-pulse-ring::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      border: 2px solid rgba(16, 185, 129, 0.55);
      animation: pulseRing 2.2s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden" style="padding-bottom: 1.5rem !important;">

  <!-- AMBIENT AURORA GLOW ORBS -->
  <div class="fixed -top-28 -left-28 w-80 h-80 rounded-full bg-indigo-600/25 blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-28 -right-28 w-80 h-80 rounded-full bg-emerald-500/20 blur-3xl pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-sm">

    <!-- BRAND IDENTITY -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 mb-3">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Elysium OS v3 &bull; Cloud Vault</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Elysium Luxury PG</h1>
      <p class="text-xs text-slate-400 mt-1">Encrypted Partner &amp; Operations Portal</p>
    </div>

    <!-- MAIN VAULT CARD -->
    <div class="rounded-[2rem] p-6 sm:p-7 bg-slate-900/80 backdrop-blur-2xl border border-white/12 shadow-2xl">

      <!-- IDENTIFIED BIOMETRIC UNLOCK CARD -->
      <div id="biometricCard" class="hidden text-center py-2">
        <div class="relative w-20 h-20 mx-auto mb-4 flex items-center justify-center rounded-full bg-gradient-to-br from-emerald-500/20 to-indigo-500/20 border border-emerald-400/40 text-emerald-400 text-3xl bio-pulse-ring cursor-pointer" onclick="triggerNativeBiometric()">
          <i class="fa-solid fa-fingerprint"></i>
        </div>

        <span class="inline-block px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 text-[10px] font-black uppercase tracking-wider mb-1">
          Biometric Linked
        </span>
        <h3 id="bioDisplayName" class="text-lg font-extrabold text-white">Master Admin</h3>
        <p id="bioUsername" class="text-xs font-mono text-slate-400 mb-5">@sreekaran</p>

        <button type="button" onclick="triggerNativeBiometric()"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-xs shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-fingerprint text-base"></i>
          <span id="bioUnlockBtnText">Tap to Unlock with Fingerprint</span>
        </button>

        <div class="mt-5 pt-4 border-t border-white/10 flex items-center justify-between text-[11px]">
          <button type="button" onclick="toggleFormVisibility(true)" class="text-slate-400 hover:text-white font-semibold transition">
            Use password instead
          </button>
          <button type="button" onclick="unlinkDeviceBiometrics()" class="text-rose-400/90 hover:text-rose-300 font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-link-slash text-[10px]"></i> Unlink Device
          </button>
        </div>
      </div>

      <!-- STANDARD LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5">Operator ID</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-indigo-400 text-xs pointer-events-none">
              <i class="fa-solid fa-at"></i>
            </span>
            <input type="text" id="loginUsername" required autocomplete="username" autofocus
                   class="w-full pl-9 pr-3 py-3 text-sm font-semibold text-white"
                   placeholder="username" />
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5">Security PIN / Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-indigo-400 text-xs pointer-events-none">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginPassword" required autocomplete="current-password"
                   class="w-full pl-9 pr-3 py-3 text-sm font-semibold text-white"
                   placeholder="••••••••" />
          </div>
        </div>

        <!-- EXPLICIT BIOMETRIC CHECKBOX (Only visible inside Android APK) -->
        <div id="biometricCheckboxContainer" class="hidden pt-1">
          <label class="flex items-start gap-2.5 p-3 rounded-2xl bg-white/5 border border-white/10 cursor-pointer select-none">
            <input type="checkbox" id="enableBiometricCheckbox"
                   class="w-4 h-4 mt-0.5 rounded text-emerald-500 focus:ring-0" />
            <div class="text-xs text-slate-200 font-semibold leading-tight">
              <span>Link Fingerprint Unlock to this phone</span>
              <p id="bioOverrideNotice" class="text-[10px] text-amber-300 mt-0.5 hidden">
                Replaces the current linked biometric profile.
              </p>
            </div>
          </label>
        </div>

        <div id="loginError" class="p-3 bg-rose-500/15 border border-rose-500/30 text-rose-300 rounded-2xl text-xs font-semibold hidden flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
          <span id="loginErrorText">Invalid credentials.</span>
        </div>

        <button type="submit" id="loginSubmitBtn"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 via-violet-600 to-emerald-600 hover:opacity-95 text-white font-extrabold text-sm shadow-xl shadow-indigo-600/30 flex items-center justify-center gap-2 mt-2">
          <span>Unlock Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

        <button type="button" id="backToBioBtn" onclick="toggleFormVisibility(false)"
                class="hidden w-full text-center text-xs font-bold text-emerald-400 hover:text-emerald-300 mt-2 py-1">
          <i class="fa-solid fa-fingerprint mr-1"></i> Back to Fingerprint Unlock
        </button>
      </form>

    </div>

    <p class="mt-5 text-center text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-shield-halved text-emerald-500 text-[10px]"></i>
      <span>HMAC-SHA256 Signed Session &bull; 1-Hr Auto-Lock</span>
    </p>
  </div>

  <script>
    let currentSavedBioUser = null;

    window.addEventListener("DOMContentLoaded", () => {
      initBiometricUI();
    });

    // Only plain page names such as "rent.html" are allowed as a post-login destination.
    // (Anything else - other sites, javascript: links - is ignored.)
    function safeRedirectTarget() {
      const wanted = new URLSearchParams(window.location.search).get("redirect") || "";
      return /^[A-Za-z0-9_-]+\.html$/.test(wanted) && wanted !== "login.html" ? wanted : "index.html";
    }

    function isAndroidApp() {
      return !!(window.AndroidBiometric && typeof window.AndroidBiometric.isApp === "function" && window.AndroidBiometric.isApp());
    }

    function initBiometricUI() {
      if (!isAndroidApp()) {
        return; // Regular browser: stay pure web, keep all fingerprint UI hidden
      }

      // Show the opt-in checkbox inside the Android app
      const checkContainer = document.getElementById("biometricCheckboxContainer");
      if (checkContainer) checkContainer.classList.remove("hidden");

      // Is a user already registered for fingerprint unlock on this phone?
      if (typeof window.AndroidBiometric.getSavedUser === "function") {
        const raw = window.AndroidBiometric.getSavedUser();
        if (raw) {
          try {
            currentSavedBioUser = JSON.parse(raw);
            if (currentSavedBioUser && currentSavedBioUser.username) {
              document.getElementById("bioDisplayName").innerText = currentSavedBioUser.displayName || currentSavedBioUser.username;
              document.getElementById("bioUsername").innerText = "@" + currentSavedBioUser.username + (currentSavedBioUser.role ? ` • ${currentSavedBioUser.role}` : "");
              document.getElementById("bioUnlockBtnText").innerText = `Unlock as ${currentSavedBioUser.displayName || currentSavedBioUser.username}`;

              const notice = document.getElementById("bioOverrideNotice");
              if (notice) {
                notice.innerText = `Replaces @${currentSavedBioUser.username}'s fingerprint on this device.`;
                notice.classList.remove("hidden");
              }

              toggleFormVisibility(false);
              // Allow WebView to complete its first visual paint frame before launching native biometric prompt
              requestAnimationFrame(() => {
                setTimeout(() => triggerNativeBiometric(), 250);
              });
              return;
            }
          } catch (e) {
            console.error("Error reading saved fingerprint user:", e);
          }
        }
      }
      toggleFormVisibility(true);
    }

    function toggleFormVisibility(showForm) {
      const bioCard = document.getElementById("biometricCard");
      const form = document.getElementById("loginForm");
      const backBtn = document.getElementById("backToBioBtn");

      if (showForm) {
        if (bioCard) bioCard.classList.add("hidden");
        form.classList.remove("hidden");
        if (currentSavedBioUser && backBtn) backBtn.classList.remove("hidden");
      } else {
        if (bioCard) bioCard.classList.remove("hidden");
        form.classList.add("hidden");
        if (backBtn) backBtn.classList.add("hidden");
      }
    }

    function triggerNativeBiometric() {
      if (window.AndroidBiometric && typeof window.AndroidBiometric.requestBiometric === "function") {
        window.AndroidBiometric.requestBiometric();
      }
    }

    // The phone calls this after a successful fingerprint with the secret it stored at enrolment
    window.onBiometricUnlock = async function (jsonText) {
      const label = document.getElementById("bioUnlockBtnText");
      try {
        const creds = JSON.parse(jsonText);
        if (label) label.innerText = "Verifying...";
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "deviceLogin", username: creds.username, deviceId: creds.deviceId, deviceSecret: creds.deviceSecret })
        });
        const data = JSON.parse(await res.text());
        if (data.status === "success" && data.session) {
          saveSession(data.session);
          window.location.replace("index.html");
          return;
        }
        if (data.code === "device_invalid" && window.AndroidBiometric && window.AndroidBiometric.clearDevice) {
          window.AndroidBiometric.clearDevice();   // expired or revoked: forget it on the phone too
          currentSavedBioUser = null;
        }
        alert(data.message || "Fingerprint login failed. Please sign in with your password.");
      } catch (e) {
        alert("Fingerprint login error: " + e.message);
      }
      if (label && currentSavedBioUser) label.innerText = `Unlock as ${currentSavedBioUser.displayName || currentSavedBioUser.username}`;
      toggleFormVisibility(true);
    };

    // Called when the fingerprint sheet is cancelled or fails
    window.onBiometricUnlockError = function (message) {
      if (message) {
        const err = document.getElementById("loginError");
        const txt = document.getElementById("loginErrorText");
        if (err && txt) { txt.innerText = message; err.classList.remove("hidden"); }
      }
      toggleFormVisibility(true);
    };

    function unlinkDeviceBiometrics() {
      if (!confirm("Remove fingerprint unlock from this device? You will need to enter your password next time.")) return;

      if (window.AndroidBiometric && typeof window.AndroidBiometric.clearDevice === "function") {
        window.AndroidBiometric.clearDevice();
      }

      currentSavedBioUser = null;
      const notice = document.getElementById("bioOverrideNotice");
      if (notice) notice.classList.add("hidden");

      toggleFormVisibility(true);
      const backBtn = document.getElementById("backToBioBtn");
      if (backBtn) backBtn.classList.add("hidden");
    }

    // Registers this phone for fingerprint unlock (only when the user ticked the box).
    // Returns a short message for the user, or "" when everything worked.
    async function enrollFingerprint(session) {
      if (!isAndroidApp() || typeof window.AndroidBiometric.enrollWithFingerprint !== "function") return "";

      if (currentSavedBioUser && currentSavedBioUser.username.toLowerCase() !== session.username.toLowerCase()) {
        const proceed = confirm(
          `Fingerprint unlock is currently registered to @${currentSavedBioUser.username}.\n\n` +
          `Registering @${session.username} will remove @${currentSavedBioUser.username}'s fingerprint access from this phone.\n\n` +
          `Do you want to proceed?`
        );
        if (!proceed) return "";
      }

      let creds;
      try {
        creds = await apiPost({ action: "enrollDevice", label: "Android app" });
      } catch (e) {
        return "Could not set up fingerprint: " + e.message;
      }

      const outcome = await new Promise((resolve) => {
        const timer = setTimeout(() => resolve({ ok: false, message: "Fingerprint setup timed out." }), 90000);
        window.onBiometricEnrollResult = (ok, message) => { clearTimeout(timer); resolve({ ok: !!ok, message: message || "" }); };
        window.AndroidBiometric.enrollWithFingerprint(JSON.stringify({
          username: session.username,
          displayName: session.displayName,
          role: session.role,
          deviceId: creds.deviceId,
          deviceSecret: creds.deviceSecret
        }));
      });

      if (!outcome.ok) {
        // the phone could not store it, so cancel the server-side link as well
        try { await apiPost({ action: "revokeDevice", deviceId: creds.deviceId }); } catch (e) {}
        return "Fingerprint unlock was not enabled" + (outcome.message ? ": " + outcome.message : ".");
      }
      return "";
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("loginSubmitBtn");
      const errBox = document.getElementById("loginError");
      const errText = document.getElementById("loginErrorText");

      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const wantsBiometric = document.getElementById("enableBiometricCheckbox").checked;

      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> Authenticating...`;

      const resetButton = () => {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      };

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", username, password })
        });
        const raw = await res.text();
        let data = {};
        try {
          data = JSON.parse(raw);
        } catch (jsonErr) {
          throw new Error("Server warming up or invalid response. Please try again.");
        }

        if (data.status === "success" && data.session) {
          saveSession(data.session);

          let notice = "";
          if (wantsBiometric) {
            btn.innerHTML = `<i class="fa-solid fa-fingerprint text-sm"></i> Setting up fingerprint...`;
            notice = await enrollFingerprint(data.session);
          }
          if (notice) {
            errText.innerText = notice + " You are signed in.";
            errBox.classList.remove("hidden");
          }

          setTimeout(() => window.location.replace(safeRedirectTarget()), notice ? 1800 : 250);

        } else {
          errText.innerText = data.message || "Invalid credentials.";
          errBox.classList.remove("hidden");
          resetButton();
        }
      } catch (err) {
        errText.innerText = err.message || "Connection error. Please try again.";
        errBox.classList.remove("hidden");
        resetButton();
      }
    }
  </script>
</body>
