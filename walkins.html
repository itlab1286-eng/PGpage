<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Elysium PG - Walkin Ledger</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Inter, Outfit & JetBrains Mono Fonts (Optimized Mobile & Desktop Readability) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style id="elysium-modern-ui">
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Outfit', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-primary: #090d16;
      --bg-elevated: #111827;
      --bg-card: rgba(17, 24, 39, 0.90);
      --bg-subtle: rgba(30, 41, 59, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.10);
      --border-input: rgba(148, 163, 184, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --card-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.55);
    }

    html.light-theme {
      --bg-primary: #eef2f7;
      --bg-elevated: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.96);
      --bg-subtle: #e2e8f0;
      --border-subtle: rgba(15, 23, 42, 0.10);
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --card-shadow: 0 10px 26px -6px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans) !important;
      background-color: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(99, 102, 241, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 90% 5%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(14, 165, 233, 0.10) 0%, transparent 45%) !important;
      background-attachment: fixed !important;
      padding-top: 0.25rem !important;
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)) !important;
      margin: 0;
      letter-spacing: -0.012em;
      overflow-x: hidden;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    h1, h2, h3 {
      font-family: var(--font-display) !important;
      letter-spacing: -0.025em !important;
    }

    .font-mono {
      font-family: var(--font-mono) !important;
    }

    /* =====================================================================
       DARK MODE HIGH-CONTRAST SURFACES & TYPOGRAPHY
       ===================================================================== */
    html:not(.light-theme) .bg-white,
    html:not(.light-theme) .focus\:bg-white:focus {
      background: var(--bg-card) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      color: #f8fafc !important;
      border-color: var(--border-subtle) !important;
    }
    /* Catch ALL slate surface shades including opacity modifiers like bg-slate-50/60 */
    html:not(.light-theme) [class*="bg-slate-50"],
    html:not(.light-theme) [class*="bg-slate-100"],
    html:not(.light-theme) [class*="bg-slate-200"] {
      background: var(--bg-subtle) !important;
      color: #f1f5f9 !important;
      border-color: var(--border-subtle) !important;
    }
    html:not(.light-theme) .hover\:bg-slate-50:hover,
    html:not(.light-theme) .hover\:bg-slate-100:hover,
    html:not(.light-theme) .hover\:bg-slate-200:hover {
      background: rgba(51, 65, 85, 0.9) !important;
      color: #ffffff !important;
    }

    /* Crisp Neutral Text Hierarchy in Dark Mode */
    html:not(.light-theme) .text-slate-900,
    html:not(.light-theme) .text-slate-800 {
      color: #f8fafc !important;
    }
    html:not(.light-theme) .text-slate-700,
    html:not(.light-theme) .text-slate-600 {
      color: #e2e8f0 !important;
    }
    html:not(.light-theme) .text-slate-500,
    html:not(.light-theme) .text-slate-400 {
      color: #94a3b8 !important;
    }
    html:not(.light-theme) .border-slate-100,
    html:not(.light-theme) .border-slate-200,
    html:not(.light-theme) .border-slate-300 {
      border-color: rgba(255, 255, 255, 0.12) !important;
    }

    /* Luminous Accent Text in Dark Mode (Prevents dark-on-dark dullness) */
    html:not(.light-theme) .text-indigo-600,
    html:not(.light-theme) .text-indigo-700,
    html:not(.light-theme) .text-indigo-800,
    html:not(.light-theme) .text-indigo-900,
    html:not(.light-theme) .text-indigo-950 { color: #a5b4fc !important; }

    html:not(.light-theme) .text-blue-600,
    html:not(.light-theme) .text-blue-700,
    html:not(.light-theme) .text-blue-800 { color: #93c5fd !important; }

    html:not(.light-theme) .text-emerald-600,
    html:not(.light-theme) .text-emerald-700,
    html:not(.light-theme) .text-emerald-800,
    html:not(.light-theme) .text-emerald-900 { color: #6ee7b7 !important; }

    html:not(.light-theme) .text-teal-600,
    html:not(.light-theme) .text-teal-700,
    html:not(.light-theme) .text-teal-800,
    html:not(.light-theme) .text-teal-900 { color: #5eead4 !important; }

    html:not(.light-theme) .text-cyan-600,
    html:not(.light-theme) .text-cyan-700,
    html:not(.light-theme) .text-cyan-800 { color: #67e8f9 !important; }

    html:not(.light-theme) .text-rose-600,
    html:not(.light-theme) .text-rose-700,
    html:not(.light-theme) .text-rose-800,
    html:not(.light-theme) .text-rose-900,
    html:not(.light-theme) .text-red-500,
    html:not(.light-theme) .text-red-600,
    html:not(.light-theme) .text-red-700 { color: #fda4af !important; }

    html:not(.light-theme) .text-amber-600,
    html:not(.light-theme) .text-amber-700,
    html:not(.light-theme) .text-amber-800,
    html:not(.light-theme) .text-amber-900 { color: #fcd34d !important; }

    html:not(.light-theme) .text-purple-600,
    html:not(.light-theme) .text-purple-700,
    html:not(.light-theme) .text-purple-800 { color: #d8b4fe !important; }

    /* Tinted Badges & Containers in Dark Mode (Both -50, -100, and hover states) */
    html:not(.light-theme) [class*="bg-indigo-50"],
    html:not(.light-theme) .bg-indigo-100,
    html:not(.light-theme) [class*="bg-blue-50"],
    html:not(.light-theme) .bg-blue-100 {
      background: rgba(99, 102, 241, 0.20) !important;
      border-color: rgba(129, 140, 248, 0.35) !important;
      color: #c7d2fe !important;
    }
    html:not(.light-theme) .hover\:bg-indigo-50:hover,
    html:not(.light-theme) .hover\:bg-indigo-100:hover,
    html:not(.light-theme) .hover\:bg-blue-100:hover {
      background: rgba(99, 102, 241, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-emerald-50"],
    html:not(.light-theme) .bg-emerald-100,
    html:not(.light-theme) [class*="bg-teal-50"],
    html:not(.light-theme) .bg-teal-100,
    html:not(.light-theme) .bg-cyan-100 {
      background: rgba(16, 185, 129, 0.20) !important;
      border-color: rgba(52, 211, 153, 0.35) !important;
      color: #a7f3d0 !important;
    }
    html:not(.light-theme) .hover\:bg-emerald-100:hover,
    html:not(.light-theme) .hover\:bg-teal-100:hover {
      background: rgba(16, 185, 129, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-rose-50"],
    html:not(.light-theme) .bg-rose-100,
    html:not(.light-theme) [class*="bg-red-50"],
    html:not(.light-theme) .bg-red-100 {
      background: rgba(244, 63, 94, 0.20) !important;
      border-color: rgba(251, 113, 133, 0.35) !important;
      color: #fecdd3 !important;
    }
    html:not(.light-theme) .hover\:bg-rose-50:hover,
    html:not(.light-theme) .hover\:bg-rose-100:hover,
    html:not(.light-theme) .hover\:bg-red-50:hover,
    html:not(.light-theme) .hover\:bg-red-100:hover {
      background: rgba(244, 63, 94, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-amber-50"],
    html:not(.light-theme) .bg-amber-100 {
      background: rgba(245, 158, 11, 0.20) !important;
      border-color: rgba(251, 191, 36, 0.35) !important;
      color: #fde68a !important;
    }
    html:not(.light-theme) .hover\:bg-amber-50:hover,
    html:not(.light-theme) .hover\:bg-amber-100:hover {
      background: rgba(245, 158, 11, 0.32) !important;
    }

    html:not(.light-theme) [class*="bg-purple-50"],
    html:not(.light-theme) .bg-purple-100 {
      background: rgba(168, 85, 247, 0.20) !important;
      border-color: rgba(192, 132, 252, 0.35) !important;
      color: #e9d5ff !important;
    }
    html:not(.light-theme) .hover\:bg-purple-100:hover {
      background: rgba(168, 85, 247, 0.32) !important;
    }

    /* Border color overrides for colored pills in Dark Mode */
    html:not(.light-theme) .border-indigo-200 { border-color: rgba(129, 140, 248, 0.35) !important; }
    html:not(.light-theme) .border-emerald-200 { border-color: rgba(52, 211, 153, 0.35) !important; }
    html:not(.light-theme) .border-rose-200 { border-color: rgba(251, 113, 133, 0.35) !important; }
    html:not(.light-theme) .border-amber-200 { border-color: rgba(251, 191, 36, 0.35) !important; }
    html:not(.light-theme) .border-purple-200 { border-color: rgba(192, 132, 252, 0.35) !important; }

    /* Active Tab & Filter Pill Clarity in Dark Mode */
    html:not(.light-theme) #tabBtnCurrent.bg-white,
    html:not(.light-theme) #tabBtnReserved.bg-white,
    html:not(.light-theme) #tabBtnFuture.bg-white,
    html:not(.light-theme) #tabBtnRooms.bg-white,
    html:not(.light-theme) #tabBtnDues.bg-white,
    html:not(.light-theme) #btnTabActive.bg-white,
    html:not(.light-theme) #btnTabCompleted.bg-white {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.5) !important;
    }
    html:not(.light-theme) #tabBtnCurrent.bg-white i,
    html:not(.light-theme) #tabBtnReserved.bg-white i,
    html:not(.light-theme) #tabBtnFuture.bg-white i,
    html:not(.light-theme) #tabBtnRooms.bg-white i,
    html:not(.light-theme) #tabBtnDues.bg-white i {
      color: #ffffff !important;
    }

    /* Solid Colored Buttons Always Keep Crisp White Text in Both Themes */
    .bg-indigo-600, .bg-blue-600, .bg-emerald-600, .bg-teal-600, .bg-rose-600, .bg-purple-600,
    [class*="from-emerald-600"], [class*="from-rose-500"], [class*="from-indigo-600"], [class*="from-rose-600"] {
      color: #ffffff !important;
    }
    .bg-indigo-600 *, .bg-blue-600 *, .bg-emerald-600 *, .bg-teal-600 *, .bg-rose-600 *, .bg-purple-600 *,
    [class*="from-emerald-600"] *, [class*="from-rose-500"] *, [class*="from-indigo-600"] *, [class*="from-rose-600"] * {
      color: #ffffff !important;
    }

    /* =====================================================================
       LIGHT MODE HIGH-CONTRAST SURFACES & TYPOGRAPHY
       ===================================================================== */
    html.light-theme .bg-white {
      background: var(--bg-card) !important;
      color: #0f172a !important;
      border-color: rgba(15, 23, 42, 0.10) !important;
    }
    html.light-theme .text-slate-900,
    html.light-theme .text-slate-800 {
      color: #0f172a !important;
    }
    html.light-theme .text-slate-700,
    html.light-theme .text-slate-600 {
      color: #334155 !important;
    }
    html.light-theme .text-slate-500,
    html.light-theme .text-slate-400 {
      color: #475569 !important;
    }
    /* Ensure any pastel -200/-300 text inside light cards becomes rich, high-contrast -700/-800 */
    html.light-theme .bg-white .text-indigo-200,
    html.light-theme .bg-white .text-indigo-300,
    html.light-theme .text-indigo-300 { color: #4338ca !important; }

    html.light-theme .bg-white .text-violet-200,
    html.light-theme .bg-white .text-violet-300,
    html.light-theme .text-violet-300 { color: #6d28d9 !important; }

    html.light-theme .bg-white .text-emerald-200,
    html.light-theme .bg-white .text-emerald-300,
    html.light-theme .text-emerald-300 { color: #047857 !important; }

    html.light-theme .bg-white .text-teal-200,
    html.light-theme .bg-white .text-teal-300,
    html.light-theme .text-teal-300 { color: #0f766e !important; }

    html.light-theme .bg-white .text-cyan-200,
    html.light-theme .bg-white .text-cyan-300,
    html.light-theme .text-cyan-300 { color: #0e7490 !important; }

    html.light-theme .bg-white .text-sky-200,
    html.light-theme .bg-white .text-sky-300,
    html.light-theme .text-sky-300 { color: #0369a1 !important; }

    html.light-theme .bg-white .text-rose-200,
    html.light-theme .bg-white .text-rose-300,
    html.light-theme .text-rose-300 { color: #be123c !important; }

    html.light-theme .bg-white .text-amber-200,
    html.light-theme .bg-white .text-amber-300,
    html.light-theme .text-amber-300 { color: #b45309 !important; }

    html.light-theme .bg-white .text-purple-200,
    html.light-theme .bg-white .text-purple-300,
    html.light-theme .text-purple-300 { color: #6b21a8 !important; }

    html.light-theme .bg-white .text-blue-200,
    html.light-theme .bg-white .text-blue-300,
    html.light-theme .text-blue-300 { color: #1d4ed8 !important; }

    /* Adaptive Cloud/Rollover Cards in Light Mode */
    html.light-theme .elysium-adaptive-card {
      background: #ffffff !important;
      border-color: rgba(15, 23, 42, 0.10) !important;
      color: #0f172a !important;
      box-shadow: var(--card-shadow) !important;
    }
    html.light-theme .elysium-adaptive-card p.text-white {
      color: #0f172a !important;
    }

    /* =====================================================================
       EXECUTIVE DARK-GLASS TOP COMMAND BAR (Always High-Contrast White Text)
       ===================================================================== */
    header {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 27, 75, 0.92) 100%) !important;
      backdrop-filter: blur(22px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(22px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.35) !important;
      border-radius: 1.6rem !important;
      position: sticky !important;
      top: 0.5rem !important;
      z-index: 30 !important;
      padding: 1rem 1.15rem !important;
      color: #ffffff !important;
    }
    header h1 {
      color: #ffffff !important;
      font-size: 1.25rem !important;
      line-height: 1.3 !important;
    }
    header p, header span.text-slate-500, header label {
      color: #cbd5e1 !important;
    }
    header .text-indigo-300 { color: #a5b4fc !important; }
    header .text-purple-200 { color: #e9d5ff !important; }
    header .text-rose-300 { color: #fda4af !important; }
    header .text-emerald-300 { color: #6ee7b7 !important; }
    header a[href="index.html"] {
      background: rgba(255, 255, 255, 0.12) !important;
      color: #ffffff !important;
      padding: 0.4rem 0.8rem !important;
      border-radius: 9999px !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      font-weight: 700 !important;
    }
    header select, header input[type="date"], header input[type="number"] {
      background: rgba(15, 23, 42, 0.82) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 0.9rem !important;
      padding: 0.45rem 0.75rem !important;
      font-weight: 700 !important;
      color-scheme: dark;
    }
    header select option {
      background: #0f172a !important;
      color: #ffffff !important;
    }

    /* Bento Cards */
    div.bg-white.rounded-2xl, div.bg-white.rounded-3xl {
      border-radius: 1.5rem !important;
      box-shadow: var(--card-shadow) !important;
      border: 1px solid var(--border-subtle) !important;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease !important;
    }

    /* Inputs, Selects & Textareas */
    input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="time"], input[type="password"], select, textarea {
      background-color: rgba(15, 23, 42, 0.72) !important;
      color: #f8fafc !important;
      border: 1px solid var(--border-input) !important;
      border-radius: 0.95rem !important;
      min-height: 2.75rem;
      padding-left: 0.85rem;
      padding-right: 0.85rem;
      transition: all 0.18s ease !important;
      color-scheme: dark;
    }
    input.pl-7 { padding-left: 2.15rem !important; }
    input.pl-8 { padding-left: 2.45rem !important; }
    input.pl-9 { padding-left: 2.65rem !important; }
    input.pl-10 { padding-left: 2.85rem !important; }
    .relative > i + input,
    .relative > span + input {
      padding-left: 2.5rem !important;
    }
    html.light-theme input[type="text"],
    html.light-theme input[type="number"],
    html.light-theme input[type="tel"],
    html.light-theme input[type="date"],
    html.light-theme input[type="time"],
    html.light-theme input[type="password"],
    html.light-theme select,
    html.light-theme textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
      color-scheme: light;
    }
    header input[type="number"],
    header input[type="date"],
    header select {
      background-color: rgba(15, 23, 42, 0.85) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
    }
    input::placeholder, textarea::placeholder {
      color: #64748b !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3.5px rgba(99, 102, 241, 0.25) !important;
      outline: none !important;
    }

    /* 3D Tactile Room Matrix Pills */
    .room-btn {
      min-height: 3.5rem;
      border-radius: 1.1rem !important;
      background: rgba(30, 41, 59, 0.72) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
      position: relative;
      overflow: hidden;
    }
    html.light-theme .room-btn:not(.active) {
      background: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .room-btn:hover:not(.active) {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.55) !important;
    }
    .room-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%) !important;
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
      box-shadow: 0 10px 24px -4px rgba(99, 102, 241, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.35) !important;
      transform: translateY(-2px) scale(1.03);
    }
    .room-btn.active span {
      color: #ffffff !important;
    }

    /* Floor Selector Pills */
    .floor-tab, .floor-btn {
      min-height: 2.4rem;
      border-radius: 0.85rem !important;
      font-weight: 800 !important;
      transition: all 0.18s ease !important;
    }
    .floor-tab.active, .floor-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 14px -2px rgba(99, 102, 241, 0.5) !important;
    }

    /* Interactive Resident Cards */
    .resident-card {
      border-radius: 1.25rem !important;
      padding: 1rem !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .resident-card.active {
      border: 2px solid #6366f1 !important;
      background: rgba(99, 102, 241, 0.16) !important;
      box-shadow: 0 12px 28px -6px rgba(99, 102, 241, 0.3) !important;
    }

    /* Tactile Buttons */
    button, a.rounded-xl, a.rounded-2xl {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
      user-select: none;
    }
    button:active:not(:disabled) {
      transform: scale(0.95) !important;
    }

    /* Mobile Bottom Sheet Modals */
    @media (max-width: 640px) {
      input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
        font-size: 15px !important;
      }
      .fixed.inset-0.z-40:not(.hidden),
      #deleteConfirmModal:not(.hidden) {
        align-items: flex-end !important;
        padding: 0 !important;
      }
      .fixed.inset-0.z-40:not(.hidden) > div,
      #deleteConfirmModal:not(.hidden) > div {
        max-width: 100% !important;
        width: 100% !important;
        border-bottom-left-radius: 0 !important;
        border-bottom-right-radius: 0 !important;
        border-top-left-radius: 2rem !important;
        border-top-right-radius: 2rem !important;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)) !important;
        animation: mobileSheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .fixed.inset-0.z-40:not(.hidden) > div::before {
        content: "";
        display: block;
        width: 3rem;
        height: 0.32rem;
        background: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
        margin: -0.35rem auto 0.9rem auto;
      }
    }
    @keyframes mobileSheetSlideUp {
      0% { opacity: 0; transform: translateY(100%); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Floating Glass Bottom App Dock */
    #elysiumBottomDock {
      position: fixed;
      bottom: calc(0.65rem + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 22px 48px -8px rgba(0, 0, 0, 0.65);
      border-radius: 1.5rem;
      padding: 0.38rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.15rem;
      width: min(96vw, 520px);
    }
    #elysiumBottomDock a,
    #elysiumBottomDock button.dock-action-btn {
      flex: 1 0 auto;
      color: #cbd5e1;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 0.45rem 0.5rem;
      border-radius: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      white-space: nowrap;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #elysiumBottomDock a i,
    #elysiumBottomDock button.dock-action-btn i {
      font-size: 1rem;
    }
    #elysiumBottomDock a.dock-active {
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
      box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.55);
      transform: translateY(-2px);
    }

    /* Slide-Up All-Modules Launcher Drawer (#elysiumAppDrawer) */
    #elysiumAppDrawer {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    #elysiumAppDrawer.open {
      display: flex;
    }
    #elysiumAppDrawer .drawer-sheet {
      width: min(100vw, 540px);
      max-height: 86vh;
      overflow-y: auto;
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      border-top-left-radius: 2rem;
      border-top-right-radius: 2rem;
      padding: 1.25rem 1.25rem calc(1.75rem + env(safe-area-inset-bottom, 0px)) 1.25rem;
      color: #f8fafc;
      animation: mobileSheetSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  
    /* =====================================================================
       ENHANCED READABILITY: CLEAN INTER + OUTFIT TYPOGRAPHY & SCALED SIZES
       ===================================================================== */
    html {
      font-size: 16.5px !important;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans) !important;
      font-size: 0.97rem !important;
      line-height: 1.55 !important;
      letter-spacing: -0.005em !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3 {
      font-family: var(--font-display) !important;
      letter-spacing: -0.018em !important;
      line-height: 1.3 !important;
    }

    header h1 {
      font-size: 1.38rem !important;
    }

    /* Upscale micro Tailwind text classes so nothing looks tiny or cramped on mobile */
    .text-\[9px\], .text-\[10px\] {
      font-size: 0.74rem !important;   /* ~12.2px instead of 9-10px */
      line-height: 1.4 !important;
    }
    .text-\[11px\] {
      font-size: 0.80rem !important;   /* ~13.2px instead of 11px */
      line-height: 1.45 !important;
    }
    .text-xs {
      font-size: 0.86rem !important;   /* ~14.2px instead of 12px */
      line-height: 1.48 !important;
    }
    .text-sm {
      font-size: 0.96rem !important;   /* ~15.8px instead of 14px */
      line-height: 1.5 !important;
    }
    .text-base {
      font-size: 1.06rem !important;   /* ~17.5px instead of 16px */
      line-height: 1.5 !important;
    }
    .text-lg {
      font-size: 1.18rem !important;
      line-height: 1.4 !important;
    }
    .text-xl {
      font-size: 1.32rem !important;
      line-height: 1.35 !important;
    }

    /* Make inputs, dropdowns, and buttons comfortably legible */
    input[type="text"], input[type="number"], input[type="tel"], input[type="date"], input[type="time"], input[type="password"], select, textarea {
      font-family: var(--font-sans) !important;
      font-size: 0.95rem !important;
      line-height: 1.45 !important;
      min-height: 2.9rem !important;
    }
    input.font-mono, .font-mono {
      font-family: var(--font-mono) !important;
      letter-spacing: -0.01em !important;
    }
    button, a.rounded-xl, a.rounded-2xl {
      line-height: 1.35 !important;
    }
    #elysiumBottomDock a,
    #elysiumBottomDock button.dock-action-btn {
      font-size: 0.72rem !important;
    }
    #elysiumBottomDock a i,
    #elysiumBottomDock button.dock-action-btn i {
      font-size: 1.08rem !important;
    }
  </style>

</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- PIN LOCK SCREEN -->
  <div id="pinLockModal" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-1">Staff Verification</h2>
      <p class="text-sm text-slate-500 mb-6">Enter PIN to access Walkin Ledger</p>
      
      <div class="flex justify-center mb-6">
        <input type="password" maxlength="6" id="staffPinInput" 
               class="w-44 text-center text-3xl tracking-widest font-mono py-2 border-2 border-slate-300 rounded-xl focus:border-indigo-600 focus:outline-none" 
               placeholder="••••" autofocus />
      </div>

      <p id="pinErrorMsg" class="text-xs text-red-500 font-semibold mb-4 hidden">Invalid PIN.</p>

      <button onclick="unlockApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition">
        Unlock Ledger
      </button>
    </div>
  </div>

  <!-- ENTRY / EDIT MODAL -->
  <div id="walkinModal" class="fixed inset-0 z-40 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 id="modalTitle" class="text-base font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-person-walking text-indigo-600"></i> Log Walkin Inquiry
        </h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form onsubmit="saveWalkin(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="entryRowIndex" />

        <!-- Sharing Requirement & Persons -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-600 font-bold mb-1">Requirement *</label>
            <select id="inputRequirement" required class="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold bg-white text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="1 sharing">1 sharing</option>
              <option value="2 sharing">2 sharing</option>
              <option value="3 sharing" selected>3 sharing</option>
              <option value="4 sharing">4 sharing</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 font-bold mb-1">No. of Persons *</label>
            <input type="number" id="inputPersons" min="1" max="20" value="1" required
                   class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <!-- Name & Phone -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-600 font-bold mb-1">Resident / Contact Name</label>
            <input type="text" id="inputName" placeholder="e.g. Mohan Krishna"
                   class="w-full px-3 py-2 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-slate-600 font-bold mb-1">Phone Number</label>
            <input type="tel" id="inputPhone" placeholder="10-digit mobile"
                   class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <!-- Amount Said (Free Text) -->
        <div>
          <label class="block text-slate-600 font-bold mb-1">Amount Said (Text) *</label>
          <input type="text" id="inputAmountSaid" required placeholder="e.g. 10000 plus 3000 slightly negotiable"
                 class="w-full px-3 py-2 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- Remarks (Free Text) -->
        <div>
          <label class="block text-slate-600 font-bold mb-1">Remarks (Text)</label>
          <textarea id="inputRemarks" rows="2" placeholder="e.g. Shown 606 and 607, non ac for nov 1"
                    class="w-full px-3 py-2 border border-slate-300 rounded-xl font-medium text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div id="modalStatusBox" class="p-2.5 rounded-xl text-xs font-semibold hidden"></div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">
            Cancel
          </button>
          <button type="submit" id="saveWalkinBtn" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Save Entry</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN PAGE WRAPPER -->
  <div class="max-w-4xl mx-auto px-4 pt-4 sm:pt-8">
    
    <!-- TOP HEADER -->
    <header class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 mb-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition flex items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Home
          </a>
          <span class="text-slate-300">&bull;</span>
          <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Walkin Ledger</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mt-1 flex items-center gap-2">
          <i class="fa-solid fa-person-walking-arrow-right text-indigo-600"></i> Elysium Walkin
        </h1>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <!-- Dynamic Month Dropdown -->
        <select id="monthSelect" onchange="onMonthChange()" class="px-3 py-2 text-xs font-black bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800">
          <option value="">Loading Month...</option>
        </select>

        <button onclick="loadWalkins(true)" class="p-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition" title="Refresh">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
        <button onclick="openNewModal()" class="px-3.5 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>New Entry</span>
        </button>
        <button type="button" onclick="toggleElysiumDrawer(true)" class="p-2 text-xs font-bold bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-400/30 rounded-xl transition" title="Quick Jump & Modules"><i class="fa-solid fa-compass"></i></button>
        <button onclick="logoutApp()" class="p-2 text-xs font-semibold bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition" title="Exit / Lock">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- SEARCH & FILTERS -->
    <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm mb-4 flex flex-wrap items-center justify-between gap-3">
      <div class="relative flex-1 min-w-[200px]">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-xs">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" id="searchInput" oninput="renderWalkins()" placeholder="Search name, phone, remarks, or amount..."
               class="w-full pl-8 pr-3 py-2 text-xs font-bold border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>

      <!-- Sharing Filters -->
      <div class="flex items-center gap-1.5 text-xs font-bold">
        <button type="button" onclick="setFilter('ALL')" id="filterALL" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white">All (<span id="countAll">0</span>)</button>
        <button type="button" onclick="setFilter('1 sharing')" id="filter1" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600">1S</button>
        <button type="button" onclick="setFilter('2 sharing')" id="filter2" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600">2S</button>
        <button type="button" onclick="setFilter('3 sharing')" id="filter3" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600">3S</button>
        <button type="button" onclick="setFilter('4 sharing')" id="filter4" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600">4S</button>
      </div>
    </div>

    <!-- ENTRIES CONTAINER -->
    <div id="walkinsContainer" class="space-y-3">
      <div class="text-center py-10 text-slate-400 text-xs font-semibold">
        <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Initializing Walkin ledger...
      </div>
    </div>

  </div>

  <script>
    let walkinsData = [];
    let currentFilter = "ALL";

    window.addEventListener("DOMContentLoaded", () => {
      if (typeof isAuthenticated === "function" && isAuthenticated()) {
        document.getElementById("pinLockModal").classList.add("hidden");
        initPage();
      } else if (typeof isAuthenticated !== "function") {
        document.getElementById("pinLockModal").classList.add("hidden");
        initPage();
      } else {
        document.getElementById("pinLockModal").classList.remove("hidden");
      }
    });

    function unlockApp() {
      verifyStaffPin("staffPinInput", "pinErrorMsg", () => {
        document.getElementById("pinLockModal").classList.add("hidden");
        initPage();
      });
    }

    async function initPage() {
      if (typeof initDynamicMonthSelect === "function") {
        await initDynamicMonthSelect("monthSelect");
      }
      loadWalkins();
    }

    function onMonthChange() {
      loadWalkins(true);
    }

    async function loadWalkins(force = false) {
      const container = document.getElementById("walkinsContainer");
      const month = document.getElementById("monthSelect").value;

      container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs font-semibold"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Syncing Walkin entries...</div>`;

      try {
        const json = await apiGet("getWalkins", { month: month, forceRefresh: force ? "true" : "" });
        if (json.status === "success") {
          walkinsData = json.walkins || [];
          renderWalkins();
        } else {
          throw new Error(json.message || "Failed to load records");
        }
      } catch (err) {
        container.innerHTML = `<div class="p-6 text-center text-xs text-red-500 font-bold bg-red-50 rounded-2xl border border-red-200">Error: ${esc(err.message)}</div>`;
      }
    }

    function setFilter(sharing) {
      currentFilter = sharing;
      ["ALL", "1 sharing", "2 sharing", "3 sharing", "4 sharing"].forEach(key => {
        const id = key === "ALL" ? "filterALL" : (key === "1 sharing" ? "filter1" : (key === "2 sharing" ? "filter2" : (key === "3 sharing" ? "filter3" : "filter4")));
        const btn = document.getElementById(id);
        if (!btn) return;
        if (key === sharing) {
          btn.className = "px-3 py-1.5 rounded-xl bg-indigo-600 text-white";
        } else {
          btn.className = "px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600";
        }
      });
      renderWalkins();
    }

    function renderWalkins() {
      const container = document.getElementById("walkinsContainer");
      const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      document.getElementById("countAll").innerText = walkinsData.length;

      const filtered = walkinsData.filter(item => {
        if (currentFilter !== "ALL") {
          const reqNum = currentFilter.replace(" sharing", "").trim();
          if (!item.requirement.toLowerCase().includes(reqNum)) return false;
        }
        if (!query) return true;
        return (
          item.name.toLowerCase().includes(query) ||
          item.phone.toLowerCase().includes(query) ||
          item.remarks.toLowerCase().includes(query) ||
          item.amountSaid.toLowerCase().includes(query)
        );
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 bg-white rounded-2xl border border-slate-200 text-center">
            <div class="w-12 h-12 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-2 text-lg">
              <i class="fa-solid fa-person-shelter"></i>
            </div>
            <p class="text-xs font-bold text-slate-600">No walk-in inquiries found</p>
            <p class="text-[11px] text-slate-400 mt-0.5">Click '+ New Entry' to log an inquiry</p>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-300 transition flex flex-col gap-2.5";

        const cleanPhone = String(item.phone).replace(/\D/g, "");
        const formattedWa = cleanPhone.length === 10 ? "91" + cleanPhone : cleanPhone;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-black bg-indigo-50 text-indigo-700 border border-indigo-200">
                  ${esc(item.requirement) || "Sharing not specified"}
                </span>
                <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-100 text-slate-700">
                  <i class="fa-solid fa-users text-[9px] mr-1"></i>${item.persons ? esc(item.persons) + ' person(s)' : '1 person'}
                </span>
                <span class="text-slate-300">&bull;</span>
                <span class="text-sm font-black text-slate-900">${esc(item.name) || 'Walkin Contact'}</span>
              </div>
              
              <p class="text-xs text-slate-500 font-semibold mt-1.5 flex items-center gap-1.5">
                <i class="fa-solid fa-phone text-[10px] text-slate-400"></i>
                <span>${esc(item.phone) || 'No phone recorded'}</span>
              </p>
            </div>

            <!-- Action Buttons: WhatsApp, Call, Edit, Delete -->
            <div class="flex items-center gap-1.5 shrink-0">
              ${cleanPhone ? `
                <a href="https://wa.me/${formattedWa}" target="_blank" class="p-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 transition" title="WhatsApp">
                  <i class="fa-brands fa-whatsapp text-sm"></i>
                </a>
                <a href="tel:${cleanPhone}" class="p-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 transition" title="Call">
                  <i class="fa-solid fa-phone text-xs"></i>
                </a>
              ` : ''}
              <button type="button" onclick="editWalkin(${item.rowIndex})" class="p-2 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition" title="Edit">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button type="button" onclick="deleteWalkin(${item.rowIndex})" class="p-2 rounded-xl bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 transition" title="Delete">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Quoted Price & Remarks -->
          <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1.5 text-xs">
            <div class="flex items-start gap-1.5">
              <span class="font-bold text-slate-500 shrink-0">Amount Said:</span>
              <span class="font-bold text-indigo-950 break-words">${esc(item.amountSaid) || 'None recorded'}</span>
            </div>
            ${item.remarks ? `
              <div class="flex items-start gap-1.5 border-t border-slate-200/60 pt-1.5">
                <span class="font-bold text-slate-500 shrink-0">Remarks:</span>
                <span class="text-slate-700 font-medium break-words">${esc(item.remarks)}</span>
              </div>
            ` : ''}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openNewModal() {
      document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-person-walking text-indigo-600"></i> Log Walkin Inquiry`;
      document.getElementById("entryRowIndex").value = "";
      document.getElementById("inputRequirement").value = "3 sharing";
      document.getElementById("inputPersons").value = "1";
      document.getElementById("inputName").value = "";
      document.getElementById("inputPhone").value = "";
      document.getElementById("inputAmountSaid").value = "";
      document.getElementById("inputRemarks").value = "";
      document.getElementById("modalStatusBox").classList.add("hidden");
      document.getElementById("walkinModal").classList.remove("hidden");
    }

    function editWalkin(rowIndex) {
      const item = walkinsData.find(w => w.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-pen text-indigo-600"></i> Edit Inquiry (Row #${rowIndex})`;
      document.getElementById("entryRowIndex").value = item.rowIndex;
      document.getElementById("inputRequirement").value = item.requirement || "3 sharing";
      document.getElementById("inputPersons").value = item.persons || "1";
      document.getElementById("inputName").value = item.name || "";
      document.getElementById("inputPhone").value = item.phone || "";
      document.getElementById("inputAmountSaid").value = item.amountSaid || "";
      document.getElementById("inputRemarks").value = item.remarks || "";
      document.getElementById("modalStatusBox").classList.add("hidden");
      document.getElementById("walkinModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("walkinModal").classList.add("hidden");
    }

    async function saveWalkin(e) {
      e.preventDefault();
      const btn = document.getElementById("saveWalkinBtn");
      const statusBox = document.getElementById("modalStatusBox");
      const month = document.getElementById("monthSelect").value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...`;
      statusBox.className = "p-2.5 rounded-xl text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200 block";
      statusBox.innerText = "Writing to Walkin sheet...";

      let cleanPhone = "";
      try {
        cleanPhone = validateMobileInput(document.getElementById("inputPhone"), false);
      } catch (valErr) {
        statusBox.className = "p-2.5 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200 block";
        statusBox.innerText = valErr.message;
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Save Entry</span>`;
        return;
      }

      const payload = {
        action: "saveWalkin",
        month: month,
        rowIndex: document.getElementById("entryRowIndex").value,
        expected: document.getElementById("entryRowIndex").value ? walkinExpected(document.getElementById("entryRowIndex").value) : undefined,
        requirement: document.getElementById("inputRequirement").value,
        persons: document.getElementById("inputPersons").value,
        name: document.getElementById("inputName").value,
        phone: cleanPhone,
        amountSaid: document.getElementById("inputAmountSaid").value,
        remarks: document.getElementById("inputRemarks").value
      };

      try {
        const res = await apiPost(payload);
        if (res.status === "success") {
          statusBox.className = "p-2.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 block";
          statusBox.innerHTML = `✓ ${esc(res.message || "Saved successfully!")}`;

          setTimeout(() => {
            closeModal();
            loadWalkins(true);
          }, 700);
        } else {
          throw new Error(res.message || "Failed to save entry");
        }
      } catch (err) {
        statusBox.className = "p-2.5 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200 block";
        statusBox.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Save Entry</span>`;
      }
    }

    // What the row looked like when the list loaded - the server re-checks it before editing / deleting
    function walkinExpected(rowIndex) {
      const w = walkinsData.find(x => x.rowIndex === Number(rowIndex));
      return w ? { requirement: w.requirement, name: w.name, phone: w.phone } : undefined;
    }

    async function deleteWalkin(rowIndex) {
      const item = walkinsData.find(x => x.rowIndex === Number(rowIndex));
      const displayName = item && item.name ? `"${item.name}"` : `this inquiry`;
      if (!confirm(`Are you sure you want to delete ${displayName}?`)) return;

      const month = document.getElementById("monthSelect").value;
      try {
        const res = await apiPost({
          action: "deleteWalkin",
          month: month,
          rowIndex: rowIndex,
          expected: walkinExpected(rowIndex)
        });

        if (res.status === "success") {
          loadWalkins(true);
        } else {
          alert("Error: " + (res.message || "Failed to delete record"));
        }
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    // esc() now comes from auth.js (it also escapes apostrophes)
  </script>
</body>
</html>
