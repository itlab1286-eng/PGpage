<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Elysium PG - Vacancies & Availability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="auth.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- PIN LOCK SCREEN -->
  <div id="pinLockModal" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center">
      <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-1">Staff Verification</h2>
      <p class="text-sm text-slate-500 mb-6">Enter PIN to access Vacancies</p>
      
      <div class="flex justify-center mb-6">
        <input type="password" maxlength="6" id="staffPinInput" 
               class="w-44 text-center text-3xl tracking-widest font-mono py-2 border-2 border-slate-300 rounded-xl focus:border-rose-600 focus:outline-none" 
               placeholder="••••" autofocus />
      </div>

      <p id="pinErrorMsg" class="text-xs text-red-500 font-semibold mb-4 hidden">Invalid PIN.</p>

      <button onclick="unlockApp()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-rose-500/30 transition">
        Unlock Vacancies
      </button>
    </div>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="max-w-4xl mx-auto px-4 pt-4 sm:pt-8">
    
    <!-- HEADER -->
    <header class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition flex items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Home
          </a>
          <span class="text-slate-300">&bull;</span>
          <span class="text-xs font-bold text-rose-600 uppercase tracking-wider">Live & Upcoming</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mt-1 flex items-center gap-2">
          <i class="fa-solid fa-door-open text-rose-600"></i> Elysium Vacancies
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <select id="monthSelect" onchange="loadVacancies()" class="text-xs font-bold bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-700">
          <option value="October 2026">October 2026</option>
          <option value="November 2026">November 2026</option>
        </select>
        <button onclick="logoutApp()" class="p-2 text-xs font-semibold bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition" title="Lock">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- METRICS CARDS -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-rose-600 uppercase tracking-wider">Available Now</span>
          <p id="metricCurrentOpen" class="text-3xl font-black text-slate-900 mt-1">--</p>
          <span class="text-[11px] text-slate-400">Ready for instant check-in</span>
        </div>
        <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-bed"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-amber-600 uppercase tracking-wider">Upcoming Vacancies</span>
          <p id="metricFutureOpen" class="text-3xl font-black text-slate-900 mt-1">--</p>
          <span class="text-[11px] text-slate-400">Notice served this month</span>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-clock"></i>
        </div>
      </div>
    </div>

    <!-- TABS: CURRENT VS FUTURE -->
    <div class="flex gap-2 mb-4 bg-slate-200/70 p-1 rounded-2xl">
      <button onclick="switchTab('current')" id="tabBtnCurrent" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-slate-900 shadow-sm">
        <i class="fa-solid fa-circle-check text-rose-600 mr-1.5"></i> Available Right Now (<span id="tabCountCurrent">0</span>)
      </button>
      <button onclick="switchTab('future')" id="tabBtnFuture" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600">
        <i class="fa-solid fa-calendar-days text-amber-500 mr-1.5"></i> Upcoming Vacancies (<span id="tabCountFuture">0</span>)
      </button>
    </div>

    <!-- TAB 1: CURRENT AVAILABLE BEDS -->
    <div id="sectionCurrent" class="space-y-3">
      <div id="currentCardsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="col-span-2 text-center py-10 text-slate-400 text-xs font-semibold">
          <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Checking current vacancies...
        </div>
      </div>
    </div>

    <!-- TAB 2: FUTURE / UPCOMING VACANCIES -->
    <div id="sectionFuture" class="space-y-3 hidden">
      <div id="futureCardsList" class="space-y-3">
        <div class="text-center py-10 text-slate-400 text-xs font-semibold">
          <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Checking upcoming departures...
        </div>
      </div>
    </div>

  </div>

  <script>
    let vacancyData = { currentVacancies: [], futureVacancies: [] };

    window.addEventListener("DOMContentLoaded", () => {
      if (isAuthenticated()) {
        document.getElementById("pinLockModal").classList.add("hidden");
        loadVacancies();
      } else {
        document.getElementById("pinLockModal").classList.remove("hidden");
      }
    });

    function unlockApp() {
      verifyStaffPin("staffPinInput", "pinErrorMsg", () => {
        document.getElementById("pinLockModal").classList.add("hidden");
        loadVacancies();
      });
    }

    function switchTab(tab) {
      const btnCurrent = document.getElementById("tabBtnCurrent");
      const btnFuture = document.getElementById("tabBtnFuture");
      const secCurrent = document.getElementById("sectionCurrent");
      const secFuture = document.getElementById("sectionFuture");

      if (tab === "current") {
        btnCurrent.className = "flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-slate-900 shadow-sm";
        btnFuture.className = "flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600";
        secCurrent.classList.remove("hidden");
        secFuture.classList.add("hidden");
      } else {
        btnFuture.className = "flex-1 py-2.5 rounded-xl font-bold text-xs transition bg-white text-slate-900 shadow-sm";
        btnCurrent.className = "flex-1 py-2.5 rounded-xl font-bold text-xs transition text-slate-600";
        secFuture.classList.remove("hidden");
        secCurrent.classList.add("hidden");
      }
    }

    async function loadVacancies() {
      const month = document.getElementById("monthSelect").value;
      const currentContainer = document.getElementById("currentCardsList");
      const futureContainer = document.getElementById("futureCardsList");

      currentContainer.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-400 text-xs font-semibold"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Loading vacancies for ${month}...</div>`;

      try {
        const res = await fetch(`${APPS_SCRIPT_AUTH_URL}?action=getVacanciesData&month=${encodeURIComponent(month)}`);
        const json = await res.json();

        if (json.status !== "success") throw new Error(json.message);

        vacancyData = json;
        renderVacancies();
      } catch (err) {
        currentContainer.innerHTML = `<div class="col-span-2 text-center py-6 text-rose-500 text-xs font-bold">Error: ${err.message}</div>`;
      }
    }

    function renderVacancies() {
      const currentList = vacancyData.currentVacancies || [];
      const futureList = vacancyData.futureVacancies || [];

      // Calculate total open beds across current rooms
      let totalCurrentBeds = 0;
      currentList.forEach(c => totalCurrentBeds += c.openBeds);

      document.getElementById("metricCurrentOpen").innerText = totalCurrentBeds;
      document.getElementById("metricFutureOpen").innerText = futureList.length;

      document.getElementById("tabCountCurrent").innerText = totalCurrentBeds;
      document.getElementById("tabCountFuture").innerText = futureList.length;

      // 1. Render Current Openings
      const currentContainer = document.getElementById("currentCardsList");
      if (currentList.length === 0) {
        currentContainer.innerHTML = `<div class="col-span-2 p-8 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-500 font-semibold">🎉 All rooms are completely full! No immediate vacancies.</div>`;
      } else {
        currentContainer.innerHTML = "";
        currentList.forEach(item => {
          const card = document.createElement("div");
          card.className = "p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-black text-slate-900">Room ${item.roomNumber}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${item.ac === 'Yes' ? 'bg-cyan-100 text-cyan-800' : 'bg-slate-100 text-slate-600'}">
                  ${item.ac === 'Yes' ? 'AC' : 'Non-AC'}
                </span>
              </div>
              <p class="text-xs text-slate-500 font-semibold mt-1">Floor ${item.floor} &bull; ${item.capacity}-Sharing</p>
              <p class="text-[11px] text-slate-400 mt-0.5">${item.activeCount} / ${item.capacity} beds filled</p>
            </div>
            <div class="text-right">
              <span class="inline-block px-3 py-1 bg-rose-100 text-rose-700 font-black text-xs rounded-xl">
                ${item.openBeds} Bed${item.openBeds > 1 ? 's' : ''} Open
              </span>
              <p class="text-[10px] font-bold text-rose-600 mt-1">Ready Now</p>
            </div>
          `;
          currentContainer.appendChild(card);
        });
      }

      // 2. Render Future / Upcoming Departures
      const futureContainer = document.getElementById("futureCardsList");
      if (futureList.length === 0) {
        futureContainer.innerHTML = `<div class="p-8 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-500 font-semibold">No upcoming vacate notices logged for ${document.getElementById("monthSelect").value}.</div>`;
      } else {
        futureContainer.innerHTML = "";
        futureList.forEach(item => {
          const card = document.createElement("div");
          card.className = "p-4 bg-white rounded-2xl border border-amber-200 bg-amber-50/20 shadow-sm flex flex-wrap items-center justify-between gap-3";

          // Calculate days remaining
          const today = new Date();
          today.setHours(0,0,0,0);
          const vacDate = new Date(item.vacatingDate);
          const diffDays = Math.ceil((vacDate - today) / (1000 * 60 * 60 * 24));
          const daysBadge = diffDays === 0 ? "Leaves Today" : (diffDays === 1 ? "Leaves Tomorrow" : `Leaves in ${diffDays} days`);

          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-black text-slate-900">Room ${item.roomNumber}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${item.ac === 'Yes' ? 'bg-cyan-100 text-cyan-800' : 'bg-slate-100 text-slate-600'}">
                  ${item.ac === 'Yes' ? 'AC' : 'Non-AC'}
                </span>
                <span class="text-xs text-slate-500 font-bold">&bull; ${item.capacity}-Sharing</span>
              </div>
              <p class="text-xs font-bold text-slate-800 mt-1 flex items-center gap-1.5">
                <i class="fa-solid fa-user text-amber-500 text-xs"></i> ${item.residentName}
                ${item.mobile ? `<span class="text-[11px] text-slate-400 font-normal">(${item.mobile})</span>` : ''}
              </p>
              ${item.remarks ? `<p class="text-[11px] text-slate-500 italic mt-0.5">${item.remarks}</p>` : ''}
            </div>
            <div class="text-right">
              <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 font-black text-xs rounded-xl">
                Vacant on: ${item.vacatingDate}
              </span>
              <p class="text-[11px] font-bold text-amber-600 mt-1">${daysBadge}</p>
            </div>
          `;
          futureContainer.appendChild(card);
        });
      }
    }
  </script>
</body>
</html>
